name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name without v prefix (e.g. 1.0.1). Tag push uses the tag instead.'
        required: true
        type: string
      version_code:
        description: 'Android versionCode integer (must increase each Play/GitHub release)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RAW="${{ github.ref_name }}"
            NAME="${RAW#v}"
          else
            NAME="${{ inputs.version }}"
            NAME="${NAME#v}"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CODE="${{ inputs.version_code }}"
          else
            # Derive a monotonic-ish code from semver: major*100000 + minor*1000 + patch
            IFS='.' read -r MAJOR MINOR PATCH <<<"$NAME"
            MAJOR=${MAJOR:-0}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            CODE=$((MAJOR * 100000 + MINOR * 1000 + PATCH))
          fi
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$NAME versionCode=$CODE"

      - name: Install dependencies
        run: npm ci

      - name: Decode release keystore (optional)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore written"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret — signing with debug keystore"
          fi

      - name: Build release APK
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          MITI_UPLOAD_STORE_FILE: ${{ steps.keystore.outputs.present == 'true' && 'release.keystore' || '' }}
          MITI_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MITI_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MITI_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew app:assembleRelease --no-daemon -x lint -x test

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [[ -z "$APK" ]]; then
            echo "No release APK found" >&2
            exit 1
          fi
          DEST="miti-${{ steps.ver.outputs.version_name }}.apk"
          cp "$APK" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Miti ${{ steps.ver.outputs.version_name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
